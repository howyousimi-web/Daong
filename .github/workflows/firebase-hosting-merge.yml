name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main # Change to 'master' if your main GitHub branch uses that name instead
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install Flutter on the GitHub runner
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 2. Fetch dependencies and compile Flutter web assets
      - name: Build Web Application
        run: |
          flutter pub get
          flutter build web

      # 3. Ship compiled web assets straight to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DAONG_A28B8 }}
          channelId: live
          projectId: daong-a28b8